name: artifact-review
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify upstream hashes and freshness
        run: ./tests/check-artifacts.sh
